<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="glassGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF5722;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#FF5722;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#FF5722;stop-opacity:0.3" />
    </linearGradient>
    <linearGradient id="blobGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFEB3B" />
      <stop offset="100%" style="stop-color:#FF5722" />
    </linearGradient>
    <linearGradient id="metalGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a120f" />
      <stop offset="50%" style="stop-color:#3d2b24" />
      <stop offset="100%" style="stop-color:#1a120f" />
    </linearGradient>
  </defs>
  
  <!-- Adjusted Base -->
  <path d="M30 98 C30 90 45 88 45 82 L55 82 C55 88 70 90 70 98 Z" fill="url(#metalGradient)" />
  <path d="M45 82 C45 78 35 72 35 72 L65 72 C65 72 55 78 55 82 Z" fill="url(#metalGradient)" />
  
  <!-- Adjusted Tapered Glass Body -->
  <path d="M35 72 C25 72 35 40 45 10 L55 10 C65 40 75 72 65 72 Z" fill="url(#glassGradient)" stroke="#FF5722" stroke-width="0.5" stroke-opacity="0.3" />
  
  <!-- Flat Cap -->
  <path d="M45 10 L55 10 L54 2 C54 2 50 1 46 2 L45 10Z" fill="url(#metalGradient)" />
  
  <!-- Blobs -->
  <circle cx="50" cy="62" r="8" fill="url(#blobGradient)" />
  <circle cx="45" cy="45" r="5" fill="url(#blobGradient)" />
  <circle cx="54" cy="28" r="4" fill="url(#blobGradient)" />
  <circle cx="50" cy="18" r="2" fill="url(#blobGradient)" />
</svg>